; Firmware des nœuds XIAO ESP32-C6 (docs/06 §3). Un nœud = un rôle = un environnement :
;   pio run -e air -t upload            ; esp32-01 : SHT41, BMP280, GY-302, SCD41, HLK-LD2450
;   pio run -e sol -t upload            ; esp32-02 : sondes capacitives
;   pio run -e solution -t upload       ; esp32-03 : EZO-pH, EZO-EC, DS18B20, niveau cuve
;   pio run -e actionneurs -t upload    ; esp32-04 : relais / MOSFET / PWM
;   pio test -e native                  ; logique pure (trames radar, commandes, plages)
; OTA : pio run -e air -t upload --upload-port esp32-01.local (voir README).

[platformio]
default_envs = air, sol, solution, actionneurs

[esp32c6]
; Le core Arduino 3.x n'est pas dans la plateforme officielle : plateforme pioarduino.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv   ; deux partitions applicatives pour l'OTA
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=1024

[env:air]
extends = esp32c6
build_src_filter = +<air/>
build_flags = ${esp32c6.build_flags} -DNODE_ID=\"esp32-01\" -DNODE_ZONE=\"z1\" -DHAS_SCD41=1
lib_deps =
    ${esp32c6.lib_deps}
    adafruit/Adafruit SHT4x Library@^1.0.5
    adafruit/Adafruit BMP280 Library@^2.6.8
    claws/BH1750@^1.3.0
    sensirion/Sensirion I2C SCD4x@^1.1.0

[env:sol]
extends = esp32c6
build_src_filter = +<sol/>
build_flags = ${esp32c6.build_flags} -DNODE_ID=\"esp32-02\" -DNODE_ZONE=\"z1\"

[env:solution]
extends = esp32c6
build_src_filter = +<solution/>
build_flags = ${esp32c6.build_flags} -DNODE_ID=\"esp32-03\" -DNODE_ZONE=\"z2\"
lib_deps =
    ${esp32c6.lib_deps}
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0

[env:actionneurs]
extends = esp32c6
build_src_filter = +<actionneurs/>
build_flags = ${esp32c6.build_flags} -DNODE_ID=\"esp32-04\" -DNODE_ZONE=\"z1\"

; Tests de la logique pure sur le PC (Unity), sans Arduino.
[env:native]
platform = native
build_src_filter = -<*>
test_build_src = no
lib_deps = bblanchon/ArduinoJson@^7.2.0
lib_ignore = serre_net
build_flags = -std=c++17
