# Server stack of the PC (docs/01, docs/09 §7): TimescaleDB, Grafana and, for development
# without the Pi, a mosquitto broker (profile "broker").
#
#   docker compose -f backend/docker-compose.yml --profile broker up -d     # make stack-up
#   python -m backend.db.seed && python -m backend.ingestion                # make db-init ingest
#
# Grafana: http://localhost:3000 (admin / serreia), dashboard "Serre" provisioned.
# Drop `--profile broker` when mosquitto already runs on the PC (apt) or on the Pi.

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: serreia
      POSTGRES_PASSWORD: serreia
      POSTGRES_DB: serreia
    ports: ["5432:5432"]
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serreia -d serreia"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: serreia
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/serre.json
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    profiles: ["broker"]
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

volumes:
  timescale-data:
  grafana-data:
  mosquitto-data:
