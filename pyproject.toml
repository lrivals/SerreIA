[project]
name = "serreia"
version = "0.1.0"
description = "Serre autonome et intelligente : vision, capteurs et pilotage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
vision = [
    "torch",
    "torchvision",
    "timm",
    "albumentations",
    "opencv-python-headless",
    "numpy>=2",
    "pandas",
    "pillow",
    "pyarrow",
    "imagehash",
    "scikit-learn",
    "mlflow",
    "pyyaml",
    "tqdm",
    "grad-cam",
    "onnx",
    "onnxruntime",
    "matplotlib",
]
detection = [  # phase 2 (docs/04): YOLO, SAM 2 pseudo-labels, growth curves
    "ultralytics>=8.4",
    "sam2",
    "scipy",
]
edge = [  # Pi services (docs/05); picamera2 and hailo_platform come from apt (hailo-all)
    "numpy>=2",
    "opencv-python-headless",
    "onnxruntime",
    "pyyaml",
]
notebook = [
    "ipykernel",
    "nbclient",
    "nbformat",
    "ipywidgets",
]
backend = [
    "fastapi",
    "uvicorn",
    "psycopg",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "vision", "edge", "backend", "sim", "tools"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "notebooks"]  # notebooks: generated by tools/notebooks/build.py

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
