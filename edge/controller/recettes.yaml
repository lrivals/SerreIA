# Recettes de culture : consignes par espèce et par stade (docs/09 §6), lues par
# edge/controller/recipes.py. Plages [min, max] ; ph / ec : zones hydro uniquement ;
# humidite_sol : emplacements en terre / substrat (sondes capacitives, %).
# Valeurs confrontées à la littérature dans docs/22 (§11).
#   ec           : EC de la solution apportée, mS/cm (clé `ec_apport` acceptée aussi, L9)
#   ec_drainage  : EC de la solution drainée (sonde facultative, L9)
#   vpd          : kPa, contraint la brumisation et la ventilation, ne les pilote pas (L4)
#   temp_racines : T° de la solution nutritive, alerte seule (L3)
#   dli_max      : au-delà, aucun complément LED et alerte info (L1, tipburn)
#   duree_j      : durée du stade, pour `stade: auto` calculé depuis date_semis (L1)
#   complement_led : false = photopériode simple, sans complément de DLI (L15)
#   brumisation_nuit : true = brumisation permise hors photopériode (L8, défaut false)
#   sources      : par grandeur, la littérature de la valeur (L16) : refs = alias
#                  `auteur-année#chunk` de lrivals/PaperDatabase (bases/serre/), force =
#                  essai | revue | guide | commercial | deduit, plage = étendue couverte par
#                  la littérature (défaut : la consigne). Grandeur absente : « non sourcée »
#                  (dli_cible de la tomate, HR du basilic…). Lue par l'agent (get_recette) :
#                  une proposition hors de la plage doit être marquée « hors littérature ».

_sources:  # blocs partagés entre stades (ancres YAML), ignorés par recipes.py
  tomate: &src_tomate
    temperature.jour: {refs: [2018-shamshiri#003.0, 2018-shamshiri#003.2, 2020-moin-eddin-rezvani#009.2],
                       force: revue, plage: [17, 29.5]}
    temperature.nuit: {refs: [2018-shamshiri#003.2, 2018-shamshiri#009.0], force: revue,
                       plage: [12.7, 21], note: "chute des fleurs sous 12,7 °C ; Jones : nuit 18,5–21"}
    humidite: {refs: [2018-shamshiri#005.0, 2026-fanourakis#013.2, 2026-fanourakis#036.0], force: revue,
               plage: [50, 80], note: "pollinisation meilleure vers 60 % ; < 80 % contre Botrytis"}
    vpd: {refs: [2018-shamshiri#006.0, 2026-fanourakis#035.0], force: revue, plage: [0.45, 1.25],
          note: "Shamshiri cite Argus et un blog de producteur ; 0,6–1,0 en gestion phytosanitaire"}
    co2_max: {refs: [2020-hemming#012.0, 2020-hemming#025.2], force: essai, plage: [600, 900],
              note: "600–900 ppm réalisés à l'AGC 2019, gain négligeable au-delà ; un site"}
    ph: {refs: [2021-nikolaou#027.0, 2018-savvas#026.2], force: revue, plage: [5.5, 6.5]}
    ec: {refs: [2021-nikolaou#027.0, 2021-nikolaou#026.0], force: revue, plage: [1.6, 3.0],
         note: "apport 2,80 → 2,30 décroissant (Méditerranée), 2,6 / 1,6 (Europe du Nord) ; 3,0 = marge déduite"}
    ec_drainage: {refs: [2021-nikolaou#002.1], force: revue, plage: [2.2, 3.8], note: "3 ± 0,8, citation de Neto et al."}
    temp_racines: {refs: [2018-shamshiri#004.0, 2026-fanourakis#027.1], force: deduit, plage: [22, 25],
                   note: "optimums 23–27 selon les auteurs ; < 25 °C contre Fusarium"}
  laitue: &src_laitue
    temperature.jour: {refs: [2020-miller#006.1, 2021-hosseini#003.0], force: revue, plage: [18, 24],
                       note: "20–24 (revue citée par Miller) ; la consigne 16–22 est plus fraîche"}
    ph: {refs: [2013-brechner#023, 1990-hochmuth#002.0, 2023-ertle#002.3], force: guide, plage: [5.5, 6.5]}
    dli_cible: {refs: [2020-miller#001.0], force: revue, plage: [12, 15]}
    dli_max: {refs: [2023-ertle#000.2, 2013-brechner#011], force: revue, plage: [13, 17],
              note: "tipburn > 13 en continu, > 15 en 16 h (cités de Caplan et Sago) ; 17 avec flux d'air vertical"}
    vpd: {refs: [2023-ertle#013.0], force: essai, plage: [0.5, 0.9], note: "provisoire : essai qui induit le tipburn"}
    temp_racines: {refs: [2020-miller#004.3, 2020-miller#009.0], force: essai, plage: [18, 22],
                   note: "18,8 °C mieux que 13,2 avec éclairage d'appoint ; plage déduite"}
  basilic: &src_basilic
    dli_cible: {refs: [2023-walters#011.3, 2018-walters#006.3, 2018-walters#014.1], force: essai, plage: [10, 15],
                note: "optimum 11,8–13,2 pour la masse fraîche ; > 10 pour la qualité"}
    ph: {refs: [2018-walters#002.3, 2022-johnnys#008.0], force: essai, plage: [5.8, 6.2]}
    ec: {refs: [2021-hosseini#010.0, 2018-walters#000.0], force: essai, plage: [0.5, 4.0],
         note: "pas d'effet de 0,5 à 4,0 (Walters 2018) ; optimum 1,2 (Hosseini)"}
    temp_racines: {refs: [2018-walters#002.4], force: essai, plage: [20, 24], note: "22,1 ± 0,5, un seul niveau testé"}
  fraise: &src_fraise
    temperature.jour: {refs: [2016-depardieu#006.0, 2016-depardieu#006.3], force: essai, plage: [16, 23],
                       note: "consignes d'essai, non testées comme optimum"}
    temperature.nuit: {refs: [2016-depardieu#006.0, 2016-depardieu#006.3], force: essai, plage: [12, 17]}
    humidite: {refs: [2016-depardieu#006.0, 2016-depardieu#006.3], force: essai, plage: [50, 60]}
    dli_cible: {refs: [2026-garcia#001.0], force: commercial, plage: [17, 20], note: "diapositives"}
    ph: {refs: [2020-preciado-rangel#011.0, 2016-depardieu#007.1], force: essai, plage: [5.0, 6.6],
         note: "5,5 ; 5,0–6,6 observé, pas un optimum"}
    ec: {refs: [2016-depardieu#016.1, 2016-depardieu#007.0, 2026-garcia#000.0], force: guide, plage: [0.6, 1.8],
         note: "1,0–1,5 (Québec) ; Garcia (diapositives) : ≤ 1, prudence au-delà de 1,2 — conflit à arbitrer"}

tomate-standard:
  espece: tomate
  stades:
    semis:
      temperature: {jour: [20, 25], nuit: [18, 20]}
      humidite: [65, 80]
      photoperiode_h: 16
      dli_cible: 12
      complement_led: false         # pas de gain d'appoint sur plante jeune (2020-hemming#030.2)
      humidite_sol: [55, 75]
      sources: *src_tomate
    croissance:
      temperature: {jour: [20, 26], nuit: [16, 18]}
      humidite: [60, 75]
      vpd: [0.5, 1.2]
      co2_max: 900
      photoperiode_h: 16
      dli_cible: 20
      ph: [5.6, 6.2]
      ec: [2.5, 3.0]                # apport 2,80 → 2,30 décroissant par stade
      ec_drainage: [2.2, 3.8]
      temp_racines: [22, 25]
      humidite_sol: [45, 70]
      sources: *src_tomate
    floraison:
      temperature: {jour: [21, 27], nuit: [16, 19]}
      humidite: [55, 70]
      vpd: [0.5, 1.2]
      photoperiode_h: 14
      dli_cible: 25
      ph: [5.6, 6.2]
      ec: [2.2, 2.8]
      ec_drainage: [2.2, 3.8]
      temp_racines: [22, 25]
      humidite_sol: [45, 70]
      sources: *src_tomate
    fructification:
      temperature: {jour: [21, 27], nuit: [16, 19]}
      humidite: [55, 70]
      vpd: [0.5, 1.2]
      photoperiode_h: 14
      dli_cible: 25
      ph: [5.6, 6.2]
      ec: [2.0, 2.6]
      ec_drainage: [2.2, 3.8]
      temp_racines: [22, 25]
      humidite_sol: [40, 65]
      sources: *src_tomate

laitue-hydro:
  espece: laitue
  stades:
    pepiniere:
      duree_j: 11                   # 11 j en pépinière (2013-brechner#007)
      temperature: {jour: [16, 22], nuit: [12, 16]}
      humidite: [50, 70]
      photoperiode_h: 16            # Brechner : 24 h à 250 µmol/m²/s, non repris (tipburn)
      complement_led: false
      ph: [5.6, 6.0]
      ec: [0.25, 0.5]
      temp_racines: [18, 22]
      sources:
        <<: *src_laitue
        ec: {refs: [2020-miller#003.1, 2020-miller#006.0], force: essai, plage: [0.25, 0.75],
             note: "0,25 dS/m en pépinière (22 mg/L de N), puis 0,5–0,75 jusqu'à J20 ; programme appliqué, non comparé"}
    croissance:
      duree_j: 19                   # jusqu'à J30
      temperature: {jour: [16, 22], nuit: [12, 16]}
      humidite: [50, 70]
      vpd: [0.5, 0.9]
      photoperiode_h: 16
      dli_cible: 12
      dli_max: 13
      ph: [5.6, 6.0]
      ec: [0.5, 1.0]
      temp_racines: [18, 22]
      sources:
        <<: *src_laitue
        ec: {refs: [2020-miller#006.0], force: essai, plage: [0.5, 1.0],
             note: "0,5–0,75 (j 1–20) puis 0,75–1,0 (j 21–30) ; programme appliqué, non comparé"}
    finition:
      temperature: {jour: [16, 22], nuit: [12, 16]}
      humidite: [50, 70]
      vpd: [0.5, 0.9]
      photoperiode_h: 16
      dli_cible: 12
      dli_max: 13
      ph: [5.6, 6.0]
      ec: [0.9, 1.5]
      temp_racines: [18, 22]
      sources:
        <<: *src_laitue
        ec: {refs: [2021-hosseini#010.0, 2020-miller#006.0], force: essai, plage: [0.9, 2.0],
             note: "optimum 0,9, plage 0,9–1,5 (ebb-flow) ; 1,0–2,0 de J31 à J40 (Miller)"}

basilic-standard:
  espece: basilic
  stades:
    croissance:
      temperature: {jour: [20, 27], nuit: [16, 20]}
      humidite: [50, 70]
      photoperiode_h: 16
      dli_cible: 13
      ph: [5.8, 6.2]
      ec: [1.0, 1.6]
      temp_racines: [20, 24]
      humidite_sol: [40, 65]
      sources: *src_basilic

fraise-substrat:                    # docs/22 L2 : recette assemblée, consignes d'essai non optimisées
  espece: fraise
  stades:
    production:
      temperature: {jour: [19, 23], nuit: [12, 17]}
      humidite: [50, 60]
      photoperiode_h: 16            # non sourcé (n/r dans les quatre fiches)
      dli_cible: 17
      ph: [5.5, 6.2]
      ec: [1.0, 1.5]
      sources: *src_fraise
